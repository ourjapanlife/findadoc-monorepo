name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: unit-${{ github.ref }}
      cancel-in-progress: true
    env:
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
      AFFECTED: ${{ github.event_name == 'pull_request' && '--affected' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Preview comment
        run: node --test .github/scripts/preview-comment.test.mjs

      - name: Unit tests
        run: pnpm exec turbo test $AFFECTED --filter=@findadoc/web --filter=@findadoc/mcp --filter=@findadoc/utils

      # Coverage comments only for a package whose own files changed. A package that ran
      # only because a dependency changed keeps its threshold gate but gets no comment.
      - name: Changed packages
        id: changes
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@v4
        with:
          filters: |
            web:
              - 'apps/web/**'
            mcp:
              - 'apps/mcp/**'
            utils:
              - 'packages/utils/**'

      - name: Web coverage comment
        if: ${{ !cancelled() && steps.changes.outputs.web == 'true' && hashFiles('apps/web/coverage/coverage-summary.json') != '' }}
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: '@findadoc/web'
          working-directory: apps/web
          vite-config-path: vitest.unit.config.ts

      - name: MCP coverage comment
        if: ${{ !cancelled() && steps.changes.outputs.mcp == 'true' && hashFiles('apps/mcp/coverage/coverage-summary.json') != '' }}
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: '@findadoc/mcp'
          working-directory: apps/mcp

      - name: Utils coverage comment
        if: ${{ !cancelled() && steps.changes.outputs.utils == 'true' && hashFiles('packages/utils/coverage/coverage-summary.json') != '' }}
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: '@findadoc/utils'
          working-directory: packages/utils

  server:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      TEST_ENABLED: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      # 54322 is inside Linux's ephemeral range, so an outgoing connection (such as the
      # image pull) can briefly hold it and Docker cannot bind it. Reserve it first.
      - name: Reserve the database port
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54322

      # Postgres 17 in Docker on 127.0.0.1:54322, with every migration applied.
      - name: Start the local database
        working-directory: apps/server
        run: pnpm db:reset

      - name: Run server tests
        run: pnpm exec turbo test --filter=@findadoc/server

      - name: Changed server files
        id: changes
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@v4
        with:
          filters: |
            server:
              - 'apps/server/**'

      - name: Server coverage comment
        if: ${{ !cancelled() && steps.changes.outputs.server == 'true' && hashFiles('apps/server/coverage/coverage-summary.json') != '' }}
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: '@findadoc/server'
          working-directory: apps/server

      - name: Show logs on failure
        if: failure()
        working-directory: apps/server
        run: |
          docker compose -f docker/docker-compose-db.yml logs || true
          docker ps -a || true

      - name: Stop the local database
        if: always()
        working-directory: apps/server
        run: pnpm db:stop
