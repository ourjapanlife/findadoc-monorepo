name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: unit-${{ github.ref }}
      cancel-in-progress: true
    env:
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
      AFFECTED: ${{ github.event_name == 'pull_request' && '--affected' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Unit tests
        run: pnpm exec turbo test $AFFECTED --filter=@findadoc/web --filter=@findadoc/mcp --filter=@findadoc/utils

  server:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      TEST_ENABLED: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start Supabase
        working-directory: apps/server
        run: supabase start

      - name: Run server tests
        run: pnpm exec turbo test --filter=@findadoc/server

      - name: Show logs on failure
        if: failure()
        working-directory: apps/server
        run: |
          supabase status || true
          docker ps -a || true

      - name: Stop Supabase
        if: always()
        working-directory: apps/server
        run: supabase stop
