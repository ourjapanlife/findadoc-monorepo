name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: unit-${{ github.ref }}
      cancel-in-progress: true
    env:
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
      AFFECTED: ${{ github.event_name == 'pull_request' && '--affected' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Preview comment
        run: node --test .github/scripts/preview-comment.test.mjs

      - name: Unit tests
        run: pnpm exec turbo test $AFFECTED --filter=@findadoc/web --filter=@findadoc/mcp --filter=@findadoc/utils

  server:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      TEST_ENABLED: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      # 54322 is inside Linux's ephemeral range, so an outgoing connection (such as the
      # image pull) can briefly hold it and Docker cannot bind it. Reserve it first.
      - name: Reserve the database port
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54322

      # Postgres 17 in Docker on 127.0.0.1:54322, with every migration applied.
      - name: Start the local database
        working-directory: apps/server
        run: pnpm db:reset

      - name: Run server tests
        run: pnpm exec turbo test --filter=@findadoc/server

      - name: Show logs on failure
        if: failure()
        working-directory: apps/server
        run: |
          docker compose -f docker/docker-compose-db.yml logs || true
          docker ps -a || true

      - name: Stop the local database
        if: always()
        working-directory: apps/server
        run: pnpm db:stop
