name: Web

on:
  workflow_dispatch:
  # directory-refresh.yml calls this when a clinic or doctor page is missing from the live site.
  workflow_call:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - packages/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - .nvmrc
      - .github/workflows/web.yml
      - .github/scripts/amplify-hosting.sh
      - .github/scripts/run-lighthouse.sh
      - .github/scripts/preview-comment.mjs
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - apps/web/**
      - packages/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - .nvmrc
      - .github/workflows/web.yml
      - .github/scripts/amplify-hosting.sh
      - .github/scripts/run-lighthouse.sh
      - .github/scripts/preview-comment.mjs

permissions:
  contents: read

# One run per pull request or branch. A newer push to a pull request cancels the older run.
concurrency:
  group: web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  directory:
    # Production fetches the directory once, so every prerender shard renders from the same clinics
    # and doctors (#21). Previews skip directory pages and need none.
    name: Fetch the directory
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Fetch
        run: |
          pnpm --filter @findadoc/graphql build
          pnpm --filter @findadoc/utils build
          pnpm --filter @findadoc/web prerender:directory "$RUNNER_TEMP/prerender-directory.json"

      - name: Keep it for the shards
        uses: actions/upload-artifact@v7
        with:
          name: prerender-directory
          path: ${{ runner.temp }}/prerender-directory.json
          retention-days: 1
          if-no-files-found: error

  prerender:
    # Each shard renders its share of the clinic, doctor, hub, and facet pages. Shard 0 also renders
    # the pages every build has. Previews have no directory pages, so one shard is enough.
    # Shards count from 1 in the job name, from 0 in NUXT_PRERENDER_SHARD.
    name: Prerender ${{ matrix.shard.part }} of ${{ strategy.job-total }}
    needs: directory
    if: >-
      always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && (needs.directory.result == 'success' || needs.directory.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        # To change the count, add or remove entries here. Each shard's run summary says how long it took.
        shard: >-
          ${{ fromJSON(github.event_name == 'pull_request'
          && '[{"index": 0, "part": 1}]'
          || '[{"index": 0, "part": 1}, {"index": 1, "part": 2}, {"index": 2, "part": 3}, {"index": 3, "part": 4},
          {"index": 4, "part": 5}]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Get the directory
        if: github.event_name != 'pull_request'
        uses: actions/download-artifact@v8
        with:
          name: prerender-directory
          path: ${{ runner.temp }}

      - name: Build
        run: |
          pnpm --filter @findadoc/graphql build
          pnpm --filter @findadoc/utils build
          set -o pipefail
          pnpm --filter @findadoc/web build 2>&1 | tee "$RUNNER_TEMP/build.log"
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          # Previews skip clinic, doctor, hub, and facet HTML. Production on main does not.
          NUXT_SKIP_DIRECTORY_PRERENDER: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
          NUXT_PRERENDER_DIRECTORY_FILE: ${{ github.event_name != 'pull_request' && format('{0}/prerender-directory.json', runner.temp) || '' }}
          NUXT_PRERENDER_SHARD: ${{ matrix.shard.index }}/${{ strategy.job-total }}
          # One build id for every shard, so the merged site has one app manifest. Set here on every
          # run, nothing to configure. The run id, not the attempt: "Re-run failed jobs" rebuilds only
          # the failed shards, and they must match the shards kept from the first attempt.
          NUXT_BUILD_ID: ${{ github.run_id }}
          # Baked into the static site by nuxi generate. Amplify only hosts the zip.
          NUXT_PUBLIC_SENTRY_DSN: ${{ secrets.NUXT_PUBLIC_SENTRY_DSN }}
          NUXT_PUBLIC_SENTRY_ENVIRONMENT: ${{ secrets.NUXT_PUBLIC_SENTRY_ENVIRONMENT }}
          NUXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${{ secrets.NUXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE }}
          NUXT_PUBLIC_UMAMI_URL: ${{ secrets.NUXT_PUBLIC_UMAMI_URL }}
          NUXT_PUBLIC_UMAMI_SITE_ID: ${{ secrets.NUXT_PUBLIC_UMAMI_SITE_ID }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

      # One line per shard on the run's summary page: how many routes and how long they took. When the
      # slowest shard nears the job limit, add shards; when each takes seconds, fewer will do.
      - name: Report the shard
        run: |
          rendered=$(grep -oE 'Prerendered [0-9]+ routes in [0-9.]+ seconds' "$RUNNER_TEMP/build.log" | tail -n 1)
          echo "Prerender ${{ matrix.shard.part }} of ${{ strategy.job-total }}: ${rendered:-no prerender summary in the build log}" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Pack the shard
        run: tar -C apps/web/.output/public -cf "$RUNNER_TEMP/site-shard-${{ matrix.shard.index }}.tar" .

      - name: Keep the shard
        uses: actions/upload-artifact@v7
        with:
          name: site-shard-${{ matrix.shard.index }}
          path: ${{ runner.temp }}/site-shard-${{ matrix.shard.index }}.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Publish site
    needs: prerender
    if: always() && needs.prerender.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Get the shards
        uses: actions/download-artifact@v8
        with:
          pattern: site-shard-*
          path: ${{ runner.temp }}/shards
          merge-multiple: true

      # Shard files do not overlap except the app shell, 404, and build assets, which every shard
      # writes the same. The merge keeps shard 0's copy and lists every shard's pages in the one
      # build manifest, so the browser loads each page's payload on navigation.
      - name: Merge the shards
        run: |
          for tar in "$RUNNER_TEMP"/shards/site-shard-*.tar; do
            name=$(basename "$tar" .tar)
            mkdir -p "$RUNNER_TEMP/unpacked/$name"
            tar -C "$RUNNER_TEMP/unpacked/$name" -xf "$tar"
          done
          others=$(find "$RUNNER_TEMP/unpacked" -mindepth 1 -maxdepth 1 -type d ! -name site-shard-0 | sort)
          # shellcheck disable=SC2086
          pnpm --filter @findadoc/web prerender:merge "$GITHUB_WORKSPACE/apps/web/.output/public" \
            "$RUNNER_TEMP/unpacked/site-shard-0" $others
          echo "Site: $(find apps/web/.output/public -name '*.html' | wc -l) HTML files"

      # /search shows this file before the API answers (#242). Previews skip the directory, so
      # they have none. A production build without it still works, so this warns instead of failing.
      - name: Check the search snapshot
        if: github.event_name != 'pull_request'
        run: |
          snapshot=apps/web/.output/public/_directory/search.json
          if [ -s "$snapshot" ]; then
            echo "Search snapshot: $(wc -c < "$snapshot") bytes"
          else
            echo "::warning::No search snapshot was written. /search will wait for the API."
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ github.event_name == 'pull_request' && 'arn:aws:iam::677501681118:role/findadoc-github-web-preview' || 'arn:aws:iam::677501681118:role/findadoc-github-web-deploy' }}
          aws-region: ap-northeast-1

      - name: Publish to Amplify
        id: publish
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            bash .github/scripts/amplify-hosting.sh deploy "pr-${PR_NUMBER}"
          else
            bash .github/scripts/amplify-hosting.sh deploy main
          fi

      - name: Measure the preview
        if: github.event_name == 'pull_request'
        env:
          PREVIEW_URL: ${{ steps.publish.outputs.url }}
          PRODUCTION_URL: https://www.findadoc.jp
        run: |
          bash .github/scripts/run-lighthouse.sh "$PREVIEW_URL" lighthouse/preview || true
          bash .github/scripts/run-lighthouse.sh "$PRODUCTION_URL" lighthouse/production || true

      - name: Upload Lighthouse reports
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-pr-${{ github.event.pull_request.number }}
          path: lighthouse/*.html
          retention-days: 14
          if-no-files-found: ignore

      - name: Comment on the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.publish.outputs.url }}
          PRODUCTION_URL: https://www.findadoc.jp
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPORTS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node .github/scripts/preview-comment.mjs \
            --preview-url "$PREVIEW_URL" \
            --preview lighthouse/preview.report.json \
            --production lighthouse/production.report.json \
            --production-url "$PRODUCTION_URL" \
            --reports-url "$REPORTS_URL" \
            | tee "$RUNNER_TEMP/preview-comment.md" | tee -a "$GITHUB_STEP_SUMMARY"
          jq -n --rawfile body "$RUNNER_TEMP/preview-comment.md" '{body:$body}' > "$RUNNER_TEMP/preview-comment.json"
          MARKER='<!-- amplify-preview -->'
          COMMENT_ID="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" | head -n 1)"
          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" --input "$RUNNER_TEMP/preview-comment.json"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --input "$RUNNER_TEMP/preview-comment.json"
          fi
