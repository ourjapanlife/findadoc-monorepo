name: Typecheck

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: typecheck-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Typecheck
        run: pnpm exec turbo typecheck

  graphql-types:
    name: GraphQL types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: graphql-types-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Regenerate shared types and fail if they were not committed
        run: |
          pnpm exec turbo generate
          git diff --exit-code -- packages/graphql/src/index.ts
