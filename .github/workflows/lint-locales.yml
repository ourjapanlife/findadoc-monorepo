name: Lint Locales

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "45 15 * * 4"

permissions:
  contents: read
  pull-requests: write

jobs:
  locale-lint:
    name: Linting Locales
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run locale lint
        id: lint
        working-directory: apps/web
        run: |
          NODE_ENV=production node i18n/checkLocaleKeys.js --report-only > missing_keys.txt
          if [ -s missing_keys.txt ]; then
            cat missing_keys.txt
            exit 1
          fi

      - name: Comment with missing keys
        if: failure()
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const missingKeysPath = 'apps/web/missing_keys.txt';
            if (!fs.existsSync(missingKeysPath)) {
              console.log('No missing-keys report.');
              return;
            }
            const missingKeysContent = fs.readFileSync(missingKeysPath, 'utf8').trim();
            const missingKeys = missingKeysContent ? missingKeysContent.split('\n') : [];
            if (missingKeys.length === 0) return;
            const formattedKeys = missingKeys
              .map(key => key.trim() && !key.includes('json') ? `- ${key}` : `**${key}**`)
              .join('\n');
            if (!context.payload.pull_request) return;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Missing Locale Keys Found: \n${formattedKeys}\n\n### To add the missing keys, check the following box:\n\n- [ ] Update and commit missing keys in locale files`
            });
