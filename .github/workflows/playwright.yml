name: Playwright e2e

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NUXT_AUTH_TOKEN_SECRET: ${{ secrets.NUXT_AUTH_TOKEN_SECRET }}
  AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
  AUTH0_AUDIENCE: ${{ secrets.AUTH0_AUDIENCE }}
  AUTH0_SCOPE: ${{ secrets.AUTH0_SCOPE }}
  AUTH0_USERNAME: ${{ secrets.AUTH0_USERNAME }}
  AUTH0_PASSWORD: ${{ secrets.AUTH0_PASSWORD }}
  AUTH0_CLIENTID: ${{ secrets.AUTH0_CLIENTID }}
  AUTH0_CLIENTSECRET: ${{ secrets.AUTH0_CLIENTSECRET }}
  NUXT_PUBLIC_LOAD_STORES: true
  NUXT_IS_TESTING_MODE: true
  NUXT_USE_LOCAL_API: true

permissions:
  contents: read

# One group for every shard, so a new push cancels all of them.
concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Each shard starts its own database, API, and site, so the booking specs that
  # hold real times never share a database with another shard.
  playwright-e2e-shard:
    name: Playwright e2e (${{ matrix.shard-index }}/${{ matrix.shard-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard-index: [1, 2, 3, 4]
        shard-total: [4]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build shared packages
        run: |
          pnpm --filter @findadoc/graphql build
          pnpm --filter @findadoc/utils build

      # 54322 is inside Linux's ephemeral range, so an outgoing connection (such as the
      # image pull) can briefly hold it and Docker cannot bind it. Reserve it first.
      - name: Reserve the database port
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54322

      - name: Start and seed the API database
        working-directory: apps/server
        run: |
          cp .env.dev .env 2>/dev/null || true
          # A registry can rate-limit the Postgres image. Retry the start instead of
          # failing the job before any test runs.
          for attempt in 1 2 3 4 5; do
            if pnpm db:start; then
              break
            fi
            echo "db:start failed (attempt ${attempt})"
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            sleep $((attempt * 20))
          done
          pnpm db:reset
          pnpm db:seed

      - name: Start API server
        run: |
          pnpm --filter @findadoc/server dev:startserver &
          pnpm --filter @findadoc/web exec wait-on http://127.0.0.1:4000/health -t 120000
        env:
          NODE_ENV: development

      - name: Build web and start the site
        run: |
          pnpm --filter @findadoc/web build
          pnpm --filter @findadoc/web exec serve .output/public &
          pnpm --filter @findadoc/web exec wait-on http://localhost:4242 -t 60000
        env:
          NODE_ENV: development
          PORT: "4242"

      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      # Blob reports from every shard are merged into one HTML and JSON report below.
      - name: Run Playwright e2e tests
        working-directory: apps/web
        run: pnpm test:e2e:headless --shard=${{ matrix.shard-index }}/${{ matrix.shard-total }} --reporter=list,blob
        env:
          NODE_ENV: development
          PLAYWRIGHT_BASE_URL: http://localhost:4242

      - name: Upload blob report
        if: always() && hashFiles('apps/web/blob-report/*.zip') != ''
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard-index }}
          path: apps/web/blob-report/
          retention-days: 1

      - name: Stop the local database
        if: always()
        working-directory: apps/server
        run: pnpm db:stop

  # Keeps the "Playwright e2e" check name, and fails when any shard failed.
  playwright-e2e:
    name: Playwright e2e
    if: ${{ !cancelled() }}
    needs: playwright-e2e-shard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Download blob reports
        uses: actions/download-artifact@v8
        with:
          path: apps/web/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge reports
        if: hashFiles('apps/web/all-blob-reports/*.zip') != ''
        working-directory: apps/web
        run: pnpm exec playwright merge-reports --reporter=json,html ./all-blob-reports
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json

      - name: Playwright report comment
        if: github.event_name == 'pull_request' && hashFiles('apps/web/results.json') != ''
        uses: daun/playwright-report-summary@v4
        with:
          report-file: apps/web/results.json
          comment-title: "Playwright e2e test results"

      # Always kept: the clinic dashboard spec attaches a screenshot of each tab.
      - name: Upload Playwright report
        if: hashFiles('apps/web/playwright-report/index.html') != ''
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Fail when a shard failed
        if: needs.playwright-e2e-shard.result != 'success'
        run: |
          echo "A Playwright shard finished as ${{ needs.playwright-e2e-shard.result }}."
          exit 1
