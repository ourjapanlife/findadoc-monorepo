name: Playwright e2e

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NUXT_AUTH_TOKEN_SECRET: ${{ secrets.NUXT_AUTH_TOKEN_SECRET }}
  AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
  AUTH0_AUDIENCE: ${{ secrets.AUTH0_AUDIENCE }}
  AUTH0_SCOPE: ${{ secrets.AUTH0_SCOPE }}
  AUTH0_USERNAME: ${{ secrets.AUTH0_USERNAME }}
  AUTH0_PASSWORD: ${{ secrets.AUTH0_PASSWORD }}
  AUTH0_CLIENTID: ${{ secrets.AUTH0_CLIENTID }}
  AUTH0_CLIENTSECRET: ${{ secrets.AUTH0_CLIENTSECRET }}
  NUXT_PUBLIC_LOAD_STORES: true
  NUXT_IS_TESTING_MODE: true
  NUXT_USE_LOCAL_API: true

permissions:
  contents: read
  pull-requests: write

jobs:
  playwright-e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: playwright-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Build shared packages
        run: |
          pnpm --filter @findadoc/graphql build
          pnpm --filter @findadoc/utils build

      - name: Start Supabase and seed the API database
        working-directory: apps/server
        run: |
          cp .env.dev .env 2>/dev/null || true
          # public.ecr.aws rate-limits the Postgres image. Retry the pull instead of
          # failing the job before any test runs.
          for attempt in 1 2 3 4 5; do
            if supabase start; then
              break
            fi
            echo "supabase start failed (attempt ${attempt})"
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            supabase stop --no-backup || true
            sleep $((attempt * 20))
          done
          pnpm db:reset
          pnpm db:seed

      - name: Start API server
        run: |
          pnpm --filter @findadoc/server dev:startserver &
          pnpm --filter @findadoc/web exec wait-on http://127.0.0.1:4000/health -t 120000
        env:
          NODE_ENV: development

      - name: Build web and start the site
        run: |
          pnpm --filter @findadoc/web build
          pnpm --filter @findadoc/web exec serve .output/public &
          pnpm --filter @findadoc/web exec wait-on http://localhost:4242 -t 60000
        env:
          NODE_ENV: development
          PORT: "4242"

      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run Playwright e2e tests
        working-directory: apps/web
        run: pnpm test:e2e:headless
        env:
          NODE_ENV: development
          PLAYWRIGHT_BASE_URL: http://localhost:4242

      - name: Playwright report comment
        if: always() && github.event_name == 'pull_request' && hashFiles('apps/web/results.json') != ''
        uses: daun/playwright-report-summary@v4
        with:
          report-file: apps/web/results.json
          comment-title: "Playwright e2e test results"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Stop Supabase
        if: always()
        working-directory: apps/server
        run: supabase stop
