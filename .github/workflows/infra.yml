name: Infra

on:
  pull_request:
    paths:
      - infra/**
      # The API, migration and MCP Lambdas are bundled from these apps and the shared packages.
      - apps/server/**
      - apps/mcp/**
      - packages/graphql/**
      - packages/utils/**
      - .github/workflows/infra.yml
      - pnpm-lock.yaml
  push:
    branches: [main]
    paths:
      - infra/**
      # The API, migration and MCP Lambdas are bundled from these apps and the shared packages.
      - apps/server/**
      - apps/mcp/**
      - packages/graphql/**
      - packages/utils/**
      - .github/workflows/infra.yml
      - pnpm-lock.yaml

permissions:
  contents: read

jobs:
  synth:
    name: CDK synth
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: infra-synth-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      # CDK bundles the API Lambdas, which import the shared packages' dist/.
      - name: Build shared packages
        run: |
          pnpm --filter @findadoc/graphql build
          pnpm --filter @findadoc/utils build

      # No AWS credentials here. Lookups come from the committed cdk.context.json,
      # so a new lookup that is not in that file fails the check.
      - name: Synth
        run: pnpm --filter @findadoc/infra synth --quiet

  deploy:
    name: CDK deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # A first CloudFront distribution, or a rollback that deletes a VPC Lambda's network
    # interfaces, can each take 20+ minutes. A timeout mid-deploy leaves stacks half-done.
    timeout-minutes: 60
    # Never cancel a deploy halfway. Queue the next one behind it.
    concurrency:
      group: infra-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      # The role trusts only this repository's main branch. It is created by the
      # FindadocGithubDeploy stack in infra/.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::677501681118:role/findadoc-github-cdk-deploy
          aws-region: ap-northeast-1

      # CDK bundles the API Lambdas, which import the shared packages' dist/.
      - name: Build shared packages
        run: |
          pnpm --filter @findadoc/graphql build
          pnpm --filter @findadoc/utils build

      # FindadocGithubDeploy goes first, on its own. It decides which regions' bootstrap
      # roles this role may assume, and deploy --all publishes every stack's assets before
      # it deploys any stack. A new region (us-east-1 for CloudFront) has to be allowed first.
      - name: Deploy the CI role
        run: pnpm --filter @findadoc/infra run deploy FindadocGithubDeploy --require-approval never

      - name: Deploy
        run: pnpm --filter @findadoc/infra run deploy --all --require-approval never
