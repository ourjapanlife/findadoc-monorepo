openapi: 3.1.0
info:
  title: Find a Doc Japan
  description: >-
    Use Find a Doc to find healthcare facilities and professionals in Japan that
    offer services in languages other than Japanese. Find a Doc is a
    community-maintained directory — not a medical advice service.
  version: 0.1.0
  license:
    name: BSD-3-Clause
    url: https://opensource.org/license/bsd-3-clause
servers:
  - url: https://mcp.findadoc.jp
    description: Production
paths:
  /api/healthcare-professionals:
    get:
      operationId: searchHealthcareProfessionals
      summary: Search healthcare professionals
      description: >-
        Search for individual healthcare professionals in Japan by spoken
        language, medical specialty, or degree.
      parameters:
        - name: limit
          in: query
          description: Number of results to return (1-50).
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
        - name: offset
          in: query
          description: Number of results to skip, for pagination.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: spokenLanguages
          in: query
          description: Filter by spoken language codes (e.g. "en_US"). Use /api/languages for valid values.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: specialties
          in: query
          description: Filter by medical specialties (e.g. "PEDIATRICS"). Use /api/specialties for valid values.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: degrees
          in: query
          description: Filter by degrees (e.g. "MD", "DO", "PhD").
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: Matching healthcare professionals.
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalCount:
                    type: integer
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/HealthcareProfessional'
        '502':
          $ref: '#/components/responses/UpstreamError'
  /api/healthcare-professionals/{id}:
    get:
      operationId: getHealthcareProfessional
      summary: Get a healthcare professional by ID
      parameters:
        - name: id
          in: path
          required: true
          description: The unique ID (UUID) of the healthcare professional.
          schema:
            type: string
      responses:
        '200':
          description: The healthcare professional.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthcareProfessional'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/UpstreamError'
  /api/facilities:
    get:
      operationId: searchFacilities
      summary: Search healthcare facilities
      description: >-
        Search for clinics and hospitals in Japan. Note: filtering is currently
        limited to facility name and associated professional name. To find
        facilities by language or specialty, search healthcare professionals and
        look up facilities by their facilityIds.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: nameEn
          in: query
          description: Filter by English facility name (partial match).
          schema:
            type: string
        - name: nameJa
          in: query
          description: Filter by Japanese facility name (partial match).
          schema:
            type: string
        - name: healthcareProfessionalName
          in: query
          description: Filter to facilities that have a professional matching this name.
          schema:
            type: string
      responses:
        '200':
          description: Matching facilities.
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalCount:
                    type: integer
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/FacilitySummary'
        '502':
          $ref: '#/components/responses/UpstreamError'
  /api/facilities/{id}:
    get:
      operationId: getFacility
      summary: Get a facility by ID
      parameters:
        - name: id
          in: path
          required: true
          description: The unique ID (UUID) of the facility.
          schema:
            type: string
      responses:
        '200':
          description: The facility.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Facility'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/UpstreamError'
  /api/specialties:
    get:
      operationId: listSpecialties
      summary: List medical specialties and their categories
      description: >-
        Returns the valid values for the specialties filter, with English and Japanese names,
        and the categories that group them (for example MENTAL_HEALTH holds PSYCHIATRY).
        Search filters on specialties, not categories: to search a category, pass its specialty codes.
      parameters:
        - name: category
          in: query
          required: false
          description: Only the specialties in this category, and only this category.
          schema:
            type: string
            enum: [CHILDRENS_HEALTH, COSMETIC_AND_PLASTIC_SURGERY, DENTAL, DERMATOLOGY, ENT, EYE_AND_VISION, MENS_HEALTH, MENTAL_HEALTH, PHYSICAL_THERAPY, PRIMARY_CARE, SPORTS_AND_REHAB, WOMENS_HEALTH]
      responses:
        '200':
          description: Specialties and categories.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    description: Number of specialties returned.
                  specialties:
                    type: array
                    items:
                      $ref: '#/components/schemas/Specialty'
                  categories:
                    type: array
                    items:
                      $ref: '#/components/schemas/SpecialtyCategory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '502':
          $ref: '#/components/responses/UpstreamError'
  /api/languages:
    get:
      operationId: listLanguages
      summary: List spoken languages
      description: >-
        Returns the valid values for the spokenLanguages filter, with names in English, Japanese,
        and the language itself. Only codes with published true are search filters; by default only those are listed.
      parameters:
        - name: includeUnpublished
          in: query
          required: false
          description: Also list language codes that are not search filters.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Languages.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  languages:
                    type: array
                    items:
                      $ref: '#/components/schemas/Language'
        '400':
          $ref: '#/components/responses/BadRequest'
        '502':
          $ref: '#/components/responses/UpstreamError'
components:
  responses:
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: A query parameter has a value the route does not accept.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UpstreamError:
      description: The upstream Find a Doc GraphQL API returned an error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
    PersonName:
      type: object
      properties:
        firstName:
          type: string
        middleName:
          type: string
        lastName:
          type: string
        locale:
          type: string
    Address:
      type: object
      properties:
        postalCode:
          type: string
        prefectureEn:
          type: string
        cityEn:
          type: string
        addressLine1En:
          type: string
        addressLine2En:
          type: string
        prefectureJa:
          type: string
        cityJa:
          type: string
        addressLine1Ja:
          type: string
        addressLine2Ja:
          type: string
    HealthcareProfessional:
      type: object
      properties:
        id:
          type: string
        names:
          type: array
          items:
            $ref: '#/components/schemas/PersonName'
        spokenLanguages:
          type: array
          items:
            type: string
        degrees:
          type: array
          items:
            type: string
        specialties:
          type: array
          items:
            type: string
        facilityIds:
          type: array
          items:
            type: string
        additionalInfoForPatients:
          type: ['string', 'null']
    FacilitySummary:
      type: object
      properties:
        id:
          type: string
        nameEn:
          type: string
        nameJa:
          type: string
        contact:
          type: object
          properties:
            phone:
              type: string
            website:
              type: ['string', 'null']
            address:
              $ref: '#/components/schemas/Address'
        healthcareProfessionalIds:
          type: array
          items:
            type: string
    Facility:
      type: object
      properties:
        id:
          type: string
        nameEn:
          type: string
        nameJa:
          type: string
        contact:
          type: object
          properties:
            phone:
              type: string
            email:
              type: ['string', 'null']
            website:
              type: ['string', 'null']
            googleMapsUrl:
              type: string
            address:
              $ref: '#/components/schemas/Address'
        mapLatitude:
          type: number
        mapLongitude:
          type: number
        healthcareProfessionalIds:
          type: array
          items:
            type: string
        paymentOptions:
          type: array
          description: >-
            Payment methods the clinic accepts. An empty list is unknown, not
            cash only.
          items:
            type: object
            properties:
              paymentType:
                type: string
                enum: ['CASH', 'CREDIT_CARD', 'DEBIT_CARD', 'ELECTRONIC_MONEY', 'QR_CODE']
              paymentBrands:
                type: ['array', 'null']
                items:
                  type: string
                  enum: ['Visa', 'Mastercard', 'American Express', 'JCB', 'Diners Club', 'UnionPay', 'IC', 'PayPay', 'Other']
        japaneseInsurance:
          type: ['string', 'null']
          enum: ['ACCEPTED', 'NOT_ACCEPTED', null]
          description: >-
            Whether the clinic takes Japanese public health insurance. Null is
            unknown. NOT_ACCEPTED means the visit is self-pay.
    Specialty:
      type: object
      properties:
        code:
          type: string
          description: Value for the specialties filter, e.g. PSYCHIATRY.
        nameEn:
          type: string
        nameJa:
          type: string
        categories:
          type: array
          description: Categories this specialty is grouped under. May be empty.
          items:
            type: string
    SpecialtyCategory:
      type: object
      properties:
        code:
          type: string
          description: A category code, e.g. MENTAL_HEALTH.
        nameEn:
          type: string
        nameJa:
          type: string
        specialties:
          type: array
          description: Specialty codes in this category.
          items:
            type: string
    Language:
      type: object
      properties:
        code:
          type: string
          description: Value for the spokenLanguages filter, e.g. en_US.
        nameEn:
          type: string
        nameJa:
          type: string
        nameNative:
          type: string
          description: The language in its own name, e.g. 日本語.
        published:
          type: boolean
          description: True when the code is a search filter. Other codes return no results.
