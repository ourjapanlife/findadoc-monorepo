# Local Postgres for the API, its tests, and Playwright. Same port as the old local Supabase.
name: findadoc-db
services:
  db:
    image: postgres:17-alpine
    container_name: findadoc-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - 54322:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - findadoc-db:/var/lib/postgresql/data
volumes:
  findadoc-db:
