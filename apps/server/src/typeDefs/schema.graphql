input SubmitBookingInput {
  """Facility id, clinic site id, or clinic site slug."""
  clinicSiteId: ID!
  formDefinitionId: String!
  formVersion: Int!
  locale: String!
  answers: [BookingAnswerInput!]!
  """Required start inside a staff availability window. ISO 8601 UTC."""
